<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8"/>

<meta name="viewport"
content="width=device-width, initial-scale=1.0"/>

<title>Swaply Admin Portal</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

body{
  font-family:'Inter',sans-serif;
}

::-webkit-scrollbar{
  width:6px;
}

::-webkit-scrollbar-thumb{
  background:#16a34a;
  border-radius:20px;
}

</style>

</head>

<body class="bg-gradient-to-br from-gray-100 via-white to-green-50 min-h-screen">

<script>

const API =
"https://traderbackend.onrender.com";

const token =
localStorage.getItem("token");

const currentUser =
JSON.parse(localStorage.getItem("user"));

if(!token){

window.location.href =
"login.html";

}

</script>

<!-- NAVBAR -->
<header class="sticky top-0 z-50 backdrop-blur-xl bg-white/80 border-b border-gray-200">

<div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">

<div class="flex items-center gap-4">

<div class="w-14 h-14 rounded-3xl bg-green-600 flex items-center justify-center text-white text-3xl font-black shadow-xl">

S

</div>

<div>

<h1 class="text-3xl font-black text-gray-900">

Swaply Admin

</h1>

<p class="text-gray-500">

Marketplace Control Center

</p>

</div>

</div>

<div class="flex items-center gap-4">

<div class="bg-white px-5 py-3 rounded-2xl shadow-lg border">

<h3 class="font-black text-gray-900">

<span id="adminName"></span>

</h3>

<p class="text-green-600 text-sm font-bold">

Administrator

</p>

</div>

<button
onclick="logout()"
class="bg-red-500 hover:bg-red-600 transition-all text-white px-6 py-3 rounded-2xl font-black shadow-xl">

Logout

</button>

</div>

</div>

</header>

<!-- HERO -->
<section class="max-w-7xl mx-auto px-6 pt-12 pb-10">

<div class="bg-gradient-to-r from-black to-gray-900 rounded-[40px] p-10 lg:p-14 text-white shadow-2xl relative overflow-hidden">

<div class="absolute top-0 right-0 w-[500px] h-[500px] bg-green-500/20 rounded-full blur-3xl"></div>

<div class="relative z-10">

<div class="inline-flex items-center gap-3 bg-green-500/20 backdrop-blur-xl px-5 py-3 rounded-full font-bold mb-8">

<div class="w-3 h-3 bg-green-400 rounded-full animate-pulse"></div>

Admin System Online

</div>

<h1 class="text-5xl lg:text-7xl font-black leading-tight mb-8">

Marketplace
Dashboard

</h1>

<p class="text-2xl text-gray-300 leading-relaxed max-w-3xl">

Manage listings, users, marketplace messages and moderate the platform in real time.

</p>

</div>

</div>

</section>

<!-- STATS -->
<section class="max-w-7xl mx-auto px-6 pb-10">

<div class="grid md:grid-cols-4 gap-6">

<div class="bg-white rounded-[35px] shadow-xl p-8">

<h2 class="text-gray-500 font-bold text-lg mb-4">

Items

</h2>

<div id="itemsCount"
class="text-5xl font-black text-gray-900">

0

</div>

</div>

<div class="bg-white rounded-[35px] shadow-xl p-8">

<h2 class="text-gray-500 font-bold text-lg mb-4">

Users

h2>

<div id="usersCount"
class="text-5xl font-black text-gray-900">

0

</div>

</div>

<div class="bg-white rounded-[35px] shadow-xl p-8">

<h2 class="text-gray-500 font-bold text-lg mb-4">

Online

</h2>

<div id="onlineCount"
class="text-5xl font-black text-green-600">

0

</div>

</div>

<div class="bg-white rounded-[35px] shadow-xl p-8">

<h2 class="text-gray-500 font-bold text-lg mb-4">

Messages

</h2>

<div id="messagesCount"
class="text-5xl font-black text-gray-900">

0

</div>

</div>

</div>

</section>

<!-- UPLOAD -->
<section class="max-w-7xl mx-auto px-6 pb-10">

<div class="bg-white rounded-[40px] shadow-2xl p-10">

<h2 class="text-4xl font-black text-gray-900 mb-10">

Upload Item

</h2>

<div class="grid md:grid-cols-2 gap-6">

<input
type="text"
id="name"
placeholder="Item Name"
class="border-2 border-gray-200 rounded-2xl px-6 py-5 outline-none focus:border-green-500"/>

<input
type="text"
id="price"
placeholder="Price"
class="border-2 border-gray-200 rounded-2xl px-6 py-5 outline-none focus:border-green-500"/>

<input
type="text"
id="category"
placeholder="Category"
class="border-2 border-gray-200 rounded-2xl px-6 py-5 outline-none focus:border-green-500"/>

<input
type="text"
id="wanted"
placeholder="Wanted Item"
class="border-2 border-gray-200 rounded-2xl px-6 py-5 outline-none focus:border-green-500"/>

<input
type="text"
id="sellerName"
placeholder="Seller Name"
class="border-2 border-gray-200 rounded-2xl px-6 py-5 outline-none focus:border-green-500"/>

<input
type="text"
id="sellerPhone"
placeholder="Seller Phone"
class="border-2 border-gray-200 rounded-2xl px-6 py-5 outline-none focus:border-green-500"/>

<textarea
id="description"
placeholder="Description"
class="md:col-span-2 border-2 border-gray-200 rounded-2xl px-6 py-5 min-h-[150px] outline-none focus:border-green-500"></textarea>

<input
type="file"
id="image"
class="md:col-span-2 border-2 border-dashed border-gray-300 rounded-2xl px-6 py-10 bg-gray-50"/>

<button
onclick="uploadItem()"
class="md:col-span-2 bg-green-600 hover:bg-green-700 transition-all text-white py-6 rounded-2xl font-black text-xl shadow-xl">

Upload Marketplace Item

</button>

</div>

</div>

</section>

<!-- USERS -->
<section class="max-w-7xl mx-auto px-6 pb-10">

<div class="bg-white rounded-[40px] shadow-2xl p-10">

<div class="flex items-center justify-between mb-10">

<h2 class="text-4xl font-black text-gray-900">

Users

</h2>

</div>

<div
id="usersContainer"
class="grid md:grid-cols-2 xl:grid-cols-3 gap-6">

</div>

</div>

</section>

<!-- MESSAGES -->
<section class="max-w-7xl mx-auto px-6 pb-10">

<div class="bg-white rounded-[40px] shadow-2xl p-10">

<h2 class="text-4xl font-black text-gray-900 mb-10">

Marketplace Messages

</h2>

<div
id="messagesContainer"
class="space-y-6">

</div>

</div>

</section>

<!-- ITEMS -->
<section class="max-w-7xl mx-auto px-6 pb-20">

<div class="bg-white rounded-[40px] shadow-2xl p-10">

<h2 class="text-4xl font-black text-gray-900 mb-10">

Marketplace Listings

</h2>

<div
id="itemsContainer"
class="grid md:grid-cols-2 xl:grid-cols-3 gap-8">

</div>

</div>

</section>

<script>

document.getElementById("adminName")
.innerText =
currentUser.username;


// LOGOUT
async function logout(){

try{

await fetch(`${API}/logout`,{

method:"POST",

headers:{
Authorization:token
}

});

}catch(err){}

localStorage.removeItem("token");

localStorage.removeItem("user");

window.location.href =
"login.html";

}


// LOAD USERS
async function loadUsers(){

const res =
await fetch(`${API}/users`);

const users =
await res.json();

document.getElementById("usersCount")
.innerText =
users.length;

document.getElementById("onlineCount")
.innerText =
users.filter(u => u.online).length;

const container =
document.getElementById("usersContainer");

container.innerHTML = "";

users.forEach(user => {

container.innerHTML += `

<div class="bg-gray-50 rounded-[30px] p-6">

<div class="flex items-center gap-5">

<img
src="${user.avatar}"
class="w-20 h-20 rounded-full"/>

<div class="flex-1">

<h3 class="text-2xl font-black">

${user.username}

</h3>

<p class="text-gray-500">

${user.email}

</p>

<p class="${
user.online
? 'text-green-600'
: 'text-gray-500'
} font-bold mt-2">

${user.online
? 'Online'
: 'Offline'}

</p>

</div>

</div>

<button
onclick="deleteUser('${user._id}')"
class="mt-6 w-full bg-red-500 hover:bg-red-600 transition-all text-white py-4 rounded-2xl font-black">

Delete User

</button>

</div>

`;

});

}


// DELETE USER
async function deleteUser(id){

if(!confirm("Delete this user?"))
return;

await fetch(`${API}/users/${id}`,{
method:"DELETE"
});

loadUsers();

}


// LOAD ITEMS
async function loadItems(){

const res =
await fetch(`${API}/items`);

const items =
await res.json();

document.getElementById("itemsCount")
.innerText =
items.length;

const container =
document.getElementById("itemsContainer");

container.innerHTML = "";

items.forEach(item => {

container.innerHTML += `

<div class="bg-gray-50 rounded-[35px] overflow-hidden">

<img
src="${item.image}"
class="w-full h-72 object-cover"/>

<div class="p-6">

<div class="flex items-center justify-between mb-4">

<h2 class="text-3xl font-black">

${item.name}

</h2>

<div class="text-2xl font-black text-green-600">

KSh ${item.price}

</div>

</div>

<p class="text-gray-600 mb-6">

${item.description}

</p>

<div class="flex gap-4">

<button
onclick="deleteItem('${item._id}')"
class="flex-1 bg-red-500 hover:bg-red-600 transition-all text-white py-4 rounded-2xl font-black">

Delete

</button>

<button
onclick="editPrice('${item._id}')"
class="flex-1 bg-black hover:bg-gray-900 transition-all text-white py-4 rounded-2xl font-black">

Update Price

</button>

</div>

</div>

</div>

`;

});

}


// DELETE ITEM
async function deleteItem(id){

if(!confirm("Delete this item?"))
return;

await fetch(`${API}/items/${id}`,{
method:"DELETE"
});

loadItems();

}


// UPDATE PRICE
async function editPrice(id){

const price =
prompt("New Price");

if(!price) return;

await fetch(`${API}/items/${id}`,{

method:"PUT",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
price
})

});

loadItems();

}


// LOAD MESSAGES
async function loadMessages(){

const res =
await fetch(`${API}/messages`);

const messages =
await res.json();

document.getElementById("messagesCount")
.innerText =
messages.length;

const container =
document.getElementById("messagesContainer");

container.innerHTML = "";

messages.reverse().forEach(msg => {

container.innerHTML += `

<div class="bg-gray-50 rounded-[30px] p-6">

<div class="flex items-center justify-between mb-5">

<div>

<h3 class="text-2xl font-black">

${msg.senderName}

</h3>

<p class="text-gray-500">

${new Date(msg.createdAt)
.toLocaleString()}

</p>

</div>

<button
onclick="deleteMessage('${msg._id}')"
class="bg-red-500 hover:bg-red-600 transition-all text-white px-5 py-3 rounded-2xl font-black">

Delete

</button>

</div>

<div class="bg-white rounded-2xl p-5 text-lg text-gray-700 mb-6">

${msg.text}

</div>

<div class="flex gap-4">

<input
type="text"
id="reply-${msg._id}"
placeholder="Reply to user..."
class="flex-1 border-2 border-gray-200 rounded-2xl px-5 py-4 outline-none focus:border-green-500"/>

<button
onclick="replyMessage('${msg.senderId}','${msg._id}')"
class="bg-green-600 hover:bg-green-700 transition-all text-white px-8 rounded-2xl font-black">

Reply

</button>

</div>

</div>

`;

});

}


// REPLY MESSAGE
async function replyMessage(userId,messageId){

const input =
document.getElementById(`reply-${messageId}`);

const text =
input.value;

if(!text) return;

await fetch(`${API}/admin/reply`,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

receiverId:userId,

text

})

});

input.value = "";

alert("Reply sent");

loadMessages();

}


// DELETE MESSAGE
async function deleteMessage(id){

if(!confirm("Delete message?"))
return;

await fetch(`${API}/messages/${id}`,{
method:"DELETE"
});

loadMessages();

}


// UPLOAD ITEM
async function uploadItem(){

const formData =
new FormData();

formData.append(
"name",
document.getElementById("name").value
);

formData.append(
"price",
document.getElementById("price").value
);

formData.append(
"category",
document.getElementById("category").value
);

formData.append(
"wanted",
document.getElementById("wanted").value
);

formData.append(
"sellerName",
document.getElementById("sellerName").value
);

formData.append(
"sellerPhone",
document.getElementById("sellerPhone").value
);

formData.append(
"description",
document.getElementById("description").value
);

formData.append(
"image",
document.getElementById("image").files[0]
);

const res =
await fetch(`${API}/upload`,{

method:"POST",

body:formData

});

if(res.ok){

alert("Item uploaded");

loadItems();

}else{

alert("Upload failed");

}

}


// INITIAL LOAD
loadUsers();

loadItems();

loadMessages();

</script>

</body>
  </html>
