<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Swaply Admin</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">

<div class="min-h-screen flex">

<!-- SIDEBAR -->
<div class="w-72 bg-gray-900 text-white p-8">

<h1 class="text-4xl font-black text-green-500 mb-10">
Swaply Admin
</h1>

<nav class="space-y-4">

<a href="#" class="block bg-green-600 px-5 py-4 rounded-2xl">
Dashboard
</a>

<a href="#" class="block hover:bg-gray-800 px-5 py-4 rounded-2xl">
Products
</a>

<a href="#" class="block hover:bg-gray-800 px-5 py-4 rounded-2xl">
Marketplace
</a>

</nav>

</div>

<!-- CONTENT -->
<div class="flex-1 p-10">

<h2 class="text-5xl font-black mb-10">
Marketplace Manager
</h2>

<!-- UPLOAD -->
<div class="bg-white rounded-3xl shadow-xl p-10 mb-10">

<h3 class="text-3xl font-black mb-6">
Upload Product
</h3>

<form id="uploadForm"
enctype="multipart/form-data"
class="space-y-5">

<input type="text"
id="itemName"
placeholder="Item Name"
class="w-full p-5 rounded-2xl border"/>

<textarea
id="itemDesc"
placeholder="Description"
class="w-full p-5 rounded-2xl border h-32"></textarea>

<input type="number"
id="itemPrice"
placeholder="Price"
class="w-full p-5 rounded-2xl border"/>

<select
id="itemCategory"
class="w-full p-5 rounded-2xl border">

<option>Electronics</option>
<option>Phones</option>
<option>Fashion</option>
<option>Furniture</option>
<option>Vehicles</option>

</select>

<input
type="file"
id="itemImage"
accept="image/*"
class="w-full p-5 rounded-2xl border"/>

<button
type="submit"
class="w-full bg-green-600 text-white py-5 rounded-2xl font-black">

Upload Product

</button>

</form>

</div>

<!-- PRODUCTS -->
<div>

<h3 class="text-4xl font-black mb-8">
Manage Products
</h3>

<div id="itemsContainer"
class="grid md:grid-cols-2 gap-8">

</div>

</div>

</div>

</div>

<script>

const API = "https://traderbackend.onrender.com";

async function loadItems(){

const res =
await fetch(`${API}/items`);

const items =
await res.json();

const container =
document.getElementById("itemsContainer");

container.innerHTML = "";

items.forEach(item=>{

container.innerHTML += `

<div class="bg-white rounded-3xl overflow-hidden shadow-xl">

<img
src="${item.image}"
class="w-full h-64 object-cover"/>

<div class="p-6">

<input
id="name-${item._id}"
value="${item.name}"
class="w-full p-3 border rounded-xl mb-3"/>

<textarea
id="desc-${item._id}"
class="w-full p-3 border rounded-xl mb-3">${item.description}</textarea>

<input
id="price-${item._id}"
value="${item.price || 0}"
class="w-full p-3 border rounded-xl mb-3"/>

<div class="grid grid-cols-2 gap-3">

<button
onclick="updateItem('${item._id}')"
class="bg-blue-600 text-white py-3 rounded-xl font-black">

Update

</button>

<button
onclick="deleteItem('${item._id}')"
class="bg-red-600 text-white py-3 rounded-xl font-black">

Delete

</button>

</div>

</div>

</div>

`;

});

}

loadItems();

async function updateItem(id){

await fetch(`${API}/items/${id}`,{

method:"PUT",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

name:document.getElementById(`name-${id}`).value,

description:document.getElementById(`desc-${id}`).value,

price:document.getElementById(`price-${id}`).value

})

});

alert("Updated");

loadItems();

}

async function deleteItem(id){

await fetch(`${API}/items/${id}`,{

method:"DELETE"

});

alert("Deleted");

loadItems();

}

document.getElementById("uploadForm")
.addEventListener("submit", async(e)=>{

e.preventDefault();

const formData = new FormData();

formData.append("name",
document.getElementById("itemName").value);

formData.append("description",
document.getElementById("itemDesc").value);

formData.append("price",
document.getElementById("itemPrice").value);

formData.append("category",
document.getElementById("itemCategory").value);

formData.append("image",
document.getElementById("itemImage").files[0]);

await fetch(`${API}/upload`,{

method:"POST",

body:formData

});

alert("Uploaded");

loadItems();

document.getElementById("uploadForm").reset();

});

</script>

</body>
</html>
