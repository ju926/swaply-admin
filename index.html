<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Swaply Admin</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">

<div class="min-h-screen flex">

<!-- SIDEBAR -->
<div class="w-72 bg-gray-900 text-white p-8">

<h1 class="text-4xl font-black text-green-500 mb-10">
Swaply Admin
</h1>

<nav class="space-y-4">

<a href="#" class="block bg-green-600 px-5 py-4 rounded-2xl">
Dashboard
</a>

<a href="#" class="block hover:bg-gray-800 px-5 py-4 rounded-2xl">
Items
</a>

<a href="#" class="block hover:bg-gray-800 px-5 py-4 rounded-2xl">
Users
</a>

</nav>

</div>

<!-- CONTENT -->
<div class="flex-1 p-10">

<h2 class="text-5xl font-black mb-10">
Upload Marketplace Item
</h2>

<div class="bg-white rounded-3xl shadow-xl p-10 max-w-3xl">

<form id="uploadForm"
enctype="multipart/form-data"
class="space-y-6">

<input
type="text"
id="itemName"
placeholder="Item Name"
class="w-full p-5 rounded-2xl border"/>

<textarea
id="itemDesc"
placeholder="Description"
class="w-full p-5 rounded-2xl border h-40"></textarea>

<select
id="itemCategory"
class="w-full p-5 rounded-2xl border">

<option>Electronics</option>
<option>Fashion</option>
<option>Vehicles</option>
<option>Furniture</option>

</select>

<input
type="file"
id="itemImage"
accept="image/*"
class="w-full p-5 rounded-2xl border"/>

<input
type="text"
id="itemWant"
placeholder="Wanted Item"
class="w-full p-5 rounded-2xl border"/>

<button
type="submit"
class="w-full bg-green-600 text-white py-5 rounded-2xl font-black">

Upload Item

</button>

</form>

</div>

</div>

</div>

<script>

const API = "https://traderbackend.onrender.com";

document.getElementById("uploadForm")
.addEventListener("submit", async(e)=>{

e.preventDefault();

const imageFile =
document.getElementById("itemImage").files[0];

const formData = new FormData();

formData.append("name",
document.getElementById("itemName").value);

formData.append("description",
document.getElementById("itemDesc").value);

formData.append("category",
document.getElementById("itemCategory").value);

formData.append("wanted",
document.getElementById("itemWant").value);

formData.append("sellerName","Swaply");

formData.append("sellerPhone","254780204730");

formData.append("image", imageFile);

await fetch(`${API}/upload`,{

method:"POST",

body:formData

});

alert("Item Uploaded");

document.getElementById("uploadForm").reset();

});

</script>

</body>
</html>
